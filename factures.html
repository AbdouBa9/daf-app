<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DAF - Factures fournisseurs</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
    }
    a:hover {
      text-decoration: underline;
    }
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    th {
      background: #f3f4f6;
      font-weight: 600;
    }
    .status {
      font-weight: 600;
      font-size: 12px;
    }
    .status-reçue { color: #f97316; }
    .status-en_validation { color: #f97316; }
    .status-validée { color: #16a34a; }
    .status-payée { color: #0ea5e9; }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-weight:600;font-size:18px;">DAF Centre d'appel</span>
    <span style="font-size:12px;color:#6b7280;">Filiale LONASE</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
    <nav style="display:flex;gap:10px;font-size:13px;">
      <a href="index.html">Dashboard</a>
      <a href="depenses.html">Dépenses</a>
      <a href="validations.html">Validations</a>
      <a href="paie.html">Paie</a>
      <a href="factures.html">Factures</a>
    </nav>
    <span id="user-label" style="font-size:12px;color:#6b7280;">
      Connecté : ...
    </span>
  </div>
</header>

  <div class="layout">
    <!-- Liste des factures -->
    <section class="card">
      <h2 style="font-size:16px;margin-top:0;">Liste des factures</h2>
      <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">
        <span style="font-size:13px;">Filtrer par statut :</span>
        <select id="filtre-statut" onchange="chargerFactures()">
          <option value="">Tous</option>
          <option value="reçue">reçue</option>
          <option value="en_validation">en_validation</option>
          <option value="validée">validée</option>
          <option value="payée">payée</option>
        </select>
      </div>
      <table id="table-factures">
        <thead>
          <tr>
            <th>Fournisseur</th>
            <th>Numéro</th>
            <th>Date émission</th>
            <th>Échéance</th>
            <th>Montant (FCFA)</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          <!-- lignes JS -->
        </tbody>
      </table>
    </section>

    <!-- Nouvelle facture -->
    <section class="card">
      <h2 style="font-size:16px;margin-top:0;">Nouvelle facture</h2>
      <form id="form-facture" onsubmit="envoyerFacture(event)">
        <label for="fournisseur">Fournisseur</label>
        <input type="text" id="fournisseur" required placeholder="Orange Business, SFR, etc.">

        <label for="numero_facture">Numéro de facture</label>
        <input type="text" id="numero_facture" placeholder="FAC-...">

        <label for="date_emission">Date d'émission</label>
        <input type="date" id="date_emission">

        <label for="date_echeance">Date d'échéance</label>
        <input type="date" id="date_echeance" required>

        <label for="montant_fcfa">Montant (FCFA)</label>
        <input type="number" id="montant_fcfa" min="0" step="1" required>

        <label for="statut">Statut</label>
        <select id="statut">
          <option value="reçue">reçue</option>
          <option value="en_validation">en_validation</option>
          <option value="validée">validée</option>
          <option value="payée">payée</option>
        </select>

        <button type="submit">Enregistrer la facture</button>
      </form>
    </section>
  </div>

  <script>
  function getUserIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  return id || '1'; // par défaut Souadou
}

async function chargerUtilisateurCourant() {
  try {
    const userId = getUserIdFromUrl();
    const res = await fetch(`http://localhost:3000/api/user/current?id=${userId}`);
    const user = await res.json();
    const label = document.getElementById('user-label');
    if (label) {
      label.textContent = `Connecté : ${user.nom} (${user.role})`;
    }
  } catch (e) {
    console.error(e);
  }
}



    async function chargerFactures() {
      try {
        const select = document.getElementById('filtre-statut');
        const filtre = select ? select.value : '';

        let url = 'http://localhost:3000/api/factures';
        if (filtre) {
          url += '?statut=' + encodeURIComponent(filtre);
        }

        const res = await fetch(url);
        const data = await res.json();

        const tbody = document.querySelector('#table-factures tbody');
        tbody.innerHTML = '';

        data.forEach(f => {
          const tr = document.createElement('tr');

          const tdFourn = document.createElement('td');
          tdFourn.textContent = f.fournisseur;

          const tdNum = document.createElement('td');
          tdNum.textContent = f.numero_facture || '';

          const tdEmis = document.createElement('td');
          tdEmis.textContent = f.date_emission || '';

          const tdEch = document.createElement('td');
          tdEch.textContent = f.date_echeance || '';

          const tdMontant = document.createElement('td');
          tdMontant.textContent = new Intl.NumberFormat('fr-FR').format(f.montant_fcfa);

          const tdStatut = document.createElement('td');
          tdStatut.textContent = f.statut;
          tdStatut.className = 'status status-' + f.statut.replace(' ', '_');

          tr.appendChild(tdFourn);
          tr.appendChild(tdNum);
          tr.appendChild(tdEmis);
          tr.appendChild(tdEch);
          tr.appendChild(tdMontant);
          tr.appendChild(tdStatut);

          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error(e);
        alert('Erreur lors du chargement des factures');
      }
    }

    async function envoyerFacture(event) {
      event.preventDefault();

      const fournisseur = document.getElementById('fournisseur').value;
      const numero_facture = document.getElementById('numero_facture').value;
      const date_emission = document.getElementById('date_emission').value;
      const date_echeance = document.getElementById('date_echeance').value;
      const montant_fcfa = Number(document.getElementById('montant_fcfa').value);
      const statut = document.getElementById('statut').value;

      if (!fournisseur || !date_echeance || !montant_fcfa) {
        alert('Merci de remplir les champs obligatoires');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/factures', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fournisseur,
            numero_facture,
            date_emission,
            date_echeance,
            montant_fcfa,
            statut
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert('Facture enregistrée (statut : ' + data.statut + ')');
          document.getElementById('form-facture').reset();
          chargerFactures();
        } else {
          alert('Erreur: ' + (data.error || 'inconnue'));
        }
      } catch (e) {
        console.error(e);
        alert('Erreur lors de l\'enregistrement de la facture');
      }
    }

    // Chargement initial
    chargerUtilisateurCourant();
    chargerFactures();
  </script>
</body>
</html>
