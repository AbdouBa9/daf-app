<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DAF - Paie / Masse salariale</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
    }
    a:hover {
      text-decoration: underline;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      max-width: 480px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .info {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-weight:600;font-size:18px;">DAF Centre d'appel</span>
    <span style="font-size:12px;color:#6b7280;">Filiale LONASE</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
    <nav style="display:flex;gap:10px;font-size:13px;">
      <a href="index.html">Dashboard</a>
      <a href="depenses.html">Dépenses</a>
      <a href="validations.html">Validations</a>
      <a href="paie.html">Paie</a>
      <a href="factures.html">Factures</a>
    </nav>
    <span id="user-label" style="font-size:12px;color:#6b7280;">
      Connecté : ...
    </span>
  </div>
</header>

  <section class="card">
    <h2 style="font-size:16px;margin-top:0;">Masse salariale mensuelle</h2>

    <label for="mois">Mois (AAAA-MM)</label>
    <input type="text" id="mois" value="2026-06">

    <label for="masse_salariale">Masse salariale (FCFA)</label>
    <input type="number" id="masse_salariale" min="0" step="1">

    <button onclick="enregistrerPaie()">Enregistrer</button>

    <div class="info">
      Valeur actuelle pour ce mois : <span id="info-actuelle">...</span>
    </div>
  </section>

  <script>
    function getUserIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  return id || '1'; // par défaut Souadou
}

async function chargerUtilisateurCourant() {
  try {
    const userId = getUserIdFromUrl();
    const res = await fetch(`http://localhost:3000/api/user/current?id=${userId}`);
    const user = await res.json();
    const label = document.getElementById('user-label');
    if (label) {
      label.textContent = `Connecté : ${user.nom} (${user.role})`;
    }
  } catch (e) {
    console.error(e);
  }
}


    async function chargerPaie() {
      const mois = document.getElementById('mois').value;
      try {
        const res = await fetch(`http://localhost:3000/api/paie?mois=${encodeURIComponent(mois)}`);
        const data = await res.json();
        document.getElementById('info-actuelle').textContent =
          new Intl.NumberFormat('fr-FR').format(data.masse_salariale) + ' FCFA';
      } catch (e) {
        console.error(e);
        document.getElementById('info-actuelle').textContent = 'Erreur de chargement';
      }
    }

    async function enregistrerPaie() {
      const mois = document.getElementById('mois').value;
      const masse = Number(document.getElementById('masse_salariale').value);

      if (!mois || !masse) {
        alert('Merci de saisir le mois et la masse salariale');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/paie', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mois, masse_salariale: masse })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Masse salariale enregistrée pour ' + mois);
          chargerPaie();
        } else {
          alert('Erreur: ' + (data.error || 'inconnue'));
        }
      } catch (e) {
        console.error(e);
        alert('Erreur lors de l\'enregistrement');
      }
    }

    // Chargement initial
    chargerUtilisateurCourant();
    chargerPaie();
  </script>
</body>
</html>
